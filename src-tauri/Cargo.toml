[package]
name = "czeroode"
version = "2.0.0"
description = "cZEROde - private encrypted file vault"
authors = ["cZEROde"]
license = ""
repository = "https://github.com/yuniorrguez13-a11y/cZEROdeWEB"
edition = "2024"
rust-version = "1.90"

# lib + thin main.rs is the Tauri 2 template layout.
# The `_lib` suffix avoids a bin/lib output filename collision on Windows.
[lib]
name = "czeroode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# czstream (src/stream.rs, DESIGN §5.3): HKDF-SHA256 payload key + AES-256-GCM chunks. The `zeroize`
# features wipe the AES key schedule, GHASH key and HMAC/SHA-256 state on drop (hmac is listed only to
# turn its feature on for hkdf).
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1.8"

# Debug builds (cargo test, `tauri build --debug`) still decrypt at release speed. The AES-GCM generics are
# instantiated in this crate, so it is optimized too (unoptimized: ~4 MiB/s, too slow to play a video).
[profile.dev.package.czeroode]
opt-level = 2
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Smaller, faster release binary (Tauri "App Size" guide).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
